version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: fraud-backend

    ports:
      - "8000:8000"

    volumes:
      - .:/app

  frontend:
    build:
      context: .
      dockerfile: app/Dockerfile

    container_name: fraud-frontend

    ports:
      - "8501:8501"

    depends_on:
      - backend

    volumes:
      - .:/app